<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Sign Up | Roomdhundo</title>

    <!-- Google tag (gtag.js) -->
<script async src="https://www.googletagmanager.com/gtag/js?id=G-0TKM9DNE73"></script>

<script>
    window.dataLayer = window.dataLayer || [];

    function gtag() {
        dataLayer.push(arguments);
    }

    gtag('js', new Date());

    gtag('config', 'G-0TKM9DNE73');
</script>

    <link rel="stylesheet" href="style.css">

</head>


<body>

    <!-- NAVBAR -->

    <nav class="navbar">

        <div class="logo">
            Roomdhundo
        </div>

        <div class="nav-links">

            <a href="index.html">
                Home
            </a>

            <a href="search.html">
                Explore
            </a>

            <a href="#">
                List Property
            </a>

            <a href="login.html">
                Login
            </a>

        </div>

    </nav>


    <!-- SIGN UP PAGE -->

    <main class="auth-page">

        <div class="auth-card">

            <h1>
                Create your account
            </h1>

            <p class="auth-subtitle">
                Join Roomdhundo and find a place that feels like home.
            </p>


            <form id="signupForm">

                <!-- NAME -->

                <div class="auth-field">

                    <label for="signupName">
                        Full Name
                    </label>

                    <input
                        type="text"
                        id="signupName"
                        placeholder="Enter your full name"
                        required
                    >

                </div>


                <!-- EMAIL -->

                <div class="auth-field">

                    <label for="signupEmail">
                        Email
                    </label>

                    <input
                        type="email"
                        id="signupEmail"
                        placeholder="Enter your email"
                        required
                    >

                </div>


                <!-- PASSWORD -->

                <div class="auth-field">

                    <label for="signupPassword">
                        Password
                    </label>

                    <input
                        type="password"
                        id="signupPassword"
                        placeholder="Create a password"
                        required
                    >

                </div>


                <!-- CONFIRM PASSWORD -->

                <div class="auth-field">

                    <label for="signupConfirmPassword">
                        Confirm Password
                    </label>

                    <input
                        type="password"
                        id="signupConfirmPassword"
                        placeholder="Confirm your password"
                        required
                    >

                </div>


                <!-- MESSAGE -->

                <p id="signupMessage"></p>


                <!-- BUTTON -->

                <button
                    type="submit"
                    class="auth-submit-btn"
                >
                    Create Account
                </button>

            </form>


            <p class="auth-switch">

                Already have an account?

                <a href="login.html">
                    Login
                </a>

            </p>

        </div>

    </main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="script.js"></script>

<!-- =====================================================
     ROLE / PURPOSE SELECTION MODAL
===================================================== -->

<div id="roleChoiceModal" class="role-choice-overlay">

    <div class="role-choice-box">

        <button id="closeRoleChoice" class="role-close-btn">
            ×
        </button>

        <h2>How do you want to use RoomDhundo?</h2>

        <p>
            Choose an option to continue
        </p>

        <div class="role-choice-options">

            <!-- RENTER -->
            <button id="renterOption" class="role-option">

                <div class="role-icon">
                    🏠
                </div>

                <div class="role-option-text">
                    <h3>I'm a Renter</h3>

                    <span>
                        Find PGs, rooms and places to stay
                    </span>
                </div>

                <div class="role-arrow">
                    →
                </div>

            </button>


            <!-- OWNER -->
            <button id="ownerOption" class="role-option">

                <div class="role-icon">
                    🏢
                </div>

                <div class="role-option-text">

                    <h3>List My Property</h3>

                    <span>
                        List and manage your property
                    </span>

                </div>

                <div class="role-arrow">
                    →
                </div>

            </button>

        </div>

    </div>

</div>
</body>

</html>
