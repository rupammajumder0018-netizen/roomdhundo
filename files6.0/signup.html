<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Sign Up | StayNear</title>

    <link rel="stylesheet" href="style.css">

</head>


<body>

    <!-- NAVBAR -->

    <nav class="navbar">

        <div class="logo">
            StayNear
        </div>

        <div class="nav-links">

            <a href="index.html">
                Home
            </a>

            <a href="search.html">
                Explore
            </a>

            <a href="#">
                List Property
            </a>

            <a href="login.html">
                Login
            </a>

        </div>

    </nav>


    <!-- SIGN UP PAGE -->

    <main class="auth-page">

        <div class="auth-card">

            <h1>
                Create your account
            </h1>

            <p class="auth-subtitle">
                Join StayNear and find a place that feels like home.
            </p>


            <form id="signupForm">

                <!-- NAME -->

                <div class="auth-field">

                    <label for="signupName">
                        Full Name
                    </label>

                    <input
                        type="text"
                        id="signupName"
                        placeholder="Enter your full name"
                        required
                    >

                </div>


                <!-- EMAIL -->

                <div class="auth-field">

                    <label for="signupEmail">
                        Email
                    </label>

                    <input
                        type="email"
                        id="signupEmail"
                        placeholder="Enter your email"
                        required
                    >

                </div>


                <!-- PASSWORD -->

                <div class="auth-field">

                    <label for="signupPassword">
                        Password
                    </label>

                    <input
                        type="password"
                        id="signupPassword"
                        placeholder="Create a password"
                        required
                    >

                </div>


                <!-- CONFIRM PASSWORD -->

                <div class="auth-field">

                    <label for="signupConfirmPassword">
                        Confirm Password
                    </label>

                    <input
                        type="password"
                        id="signupConfirmPassword"
                        placeholder="Confirm your password"
                        required
                    >

                </div>


                <!-- MESSAGE -->

                <p id="signupMessage"></p>


                <!-- BUTTON -->

                <button
                    type="submit"
                    class="auth-submit-btn"
                >
                    Create Account
                </button>

            </form>


            <p class="auth-switch">

                Already have an account?

                <a href="login.html">
                    Login
                </a>

            </p>

        </div>

    </main>


    <script src="script.js"></script>

</body>

</html>
