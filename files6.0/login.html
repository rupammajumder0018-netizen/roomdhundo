<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In | Pg Dhundo</title>
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-0TKM9DNE73"></script>
    <script>
        window.dataLayer = window.dataLayer || [];
        function gtag() { dataLayer.push(arguments); }
        gtag("js", new Date());
        gtag("config", "G-0TKM9DNE73");
    </script>
    <script>
        document.documentElement.dataset.theme = localStorage.getItem("roomdhundo-theme") || "light";
    </script>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="rd-contrast.css">
</head>
<body class="auth-screen">
    <main class="auth-page">
        <div class="auth-card">
            <div class="auth-topbar">
                <a href="index.html" class="auth-close-round" aria-label="Close">×</a>
                <button type="button" class="theme-toggle" aria-label="Switch to dark mode" title="Switch to dark mode">🌙</button>
            </div>

            <div class="auth-brand">
                <span class="auth-brand-mark" aria-hidden="true">⌂</span>
                <span>Pg Dhundo</span>
            </div>

            <h1>Sign In</h1>
            <p class="auth-subtitle">Welcome back. Enter your details to continue.</p>

            <form id="loginForm">
                <div data-auth-role-slot></div>
                <div data-auth-social-slot></div>

                <div class="auth-field">
                    <label for="loginEmail">Email *</label>
                    <input type="email" id="loginEmail" placeholder="name@example.com" autocomplete="email" required>
                </div>

                <div class="auth-field">
                    <div class="auth-field-label-row">
                        <label for="loginPassword">Password *</label>
                        <a href="reset-password.html" class="forgot-link">Forgot password?</a>
                    </div>
                    <input type="password" id="loginPassword" placeholder="Enter password" autocomplete="current-password" required>
                </div>

                <p class="auth-message" id="loginMessage"></p>
                <button type="submit" class="auth-submit-btn">Sign in</button>
            </form>

            <p class="auth-switch">
                Don't have an account?
                <a href="signup.html">Sign Up</a>
            </p>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
    <script src="script.js"></script>
</body>
</html>
