<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Login | StayNear</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>

    <!-- NAVBAR -->

    <nav class="navbar">

        <div class="logo">
            StayNear
        </div>

        <div class="nav-links">

            <a href="index.html">
                Home
            </a>

            <a href="search.html">
                Explore
            </a>

            <a href="saved.html">
                Saved
            </a>

            <a href="signup.html">
                Sign Up
            </a>

        </div>

    </nav>


    <!-- LOGIN PAGE -->

    <main class="auth-page">

        <div class="auth-card">

            <h1>
                Welcome Back
            </h1>

            <p class="auth-subtitle">
                Login to continue using StayNear.
            </p>


            <form id="loginForm">

                <!-- EMAIL -->

                <div class="auth-field">

                    <label for="loginEmail">
                        Email
                    </label>

                    <input
                        type="email"
                        id="loginEmail"
                        placeholder="Enter your email"
                        required
                    >

                </div>


                <!-- PASSWORD -->

                <div class="auth-field">

                    <label for="loginPassword">
                        Password
                    </label>

                    <input
                        type="password"
                        id="loginPassword"
                        placeholder="Enter your password"
                        required
                    >

                </div>


                <!-- MESSAGE -->

                <p id="loginMessage"></p>


                <!-- LOGIN BUTTON -->

                <button
                    type="submit"
                    class="auth-submit-btn"
                >
                    Login
                </button>

            </form>


            <p class="auth-switch">

                Don't have an account?

                <a href="signup.html">
                    Sign Up
                </a>

            </p>

        </div>

    </main>


    <script src="script.js"></script>

</body>

</html>
