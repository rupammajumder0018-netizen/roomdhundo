<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password | StayNear</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <nav class="navbar">
        <div class="logo">StayNear</div>
        <div class="nav-links">
            <a href="index.html">Home</a>
        </div>
    </nav>

    <main class="list-property-page">

        <div class="list-property-header">
            <h1>Reset Your Password</h1>
            <p>Enter a new password for your account below.</p>
        </div>

        <form class="list-property-form" id="resetPasswordForm">

            <div class="form-group">
                <label for="newPassword">New Password</label>
                <input type="password" id="newPassword" placeholder="At least 6 characters" required>
            </div>

            <div class="form-group">
                <label for="confirmNewPassword">Confirm New Password</label>
                <input type="password" id="confirmNewPassword" placeholder="Re-enter new password" required>
            </div>

            <button type="submit" class="lp-submit-btn">Update Password</button>

            <p class="lp-note">If this link has expired, go back to the site and click "Forgot password?" again to get a new one.</p>

        </form>

    </main>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
    <script src="script.js"></script>
</body>
</html>
