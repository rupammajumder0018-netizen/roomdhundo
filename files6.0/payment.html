<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Payment | RoomDhundo</title>

    <link rel="stylesheet" href="style.css">

    <style>
        .payment-page {
            min-height: 100vh;
            padding: 60px 20px;
            display: flex;
            justify-content: center;
            align-items: flex-start;
        }

        .payment-container {
            width: 100%;
            max-width: 650px;
        }

        .payment-header {
            margin-bottom: 25px;
        }

        .payment-header h1 {
            margin: 0 0 8px;
        }

        .payment-header p {
            margin: 0;
            opacity: 0.7;
        }

        .payment-card {
            background: var(--card-bg, #ffffff);
            border-radius: 18px;
            padding: 28px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.08);
        }

        .booking-property {
            padding-bottom: 20px;
            margin-bottom: 20px;
            border-bottom: 1px solid rgba(128, 128, 128, 0.2);
        }

        .booking-property h2 {
            margin: 0 0 6px;
        }

        .booking-property p {
            margin: 0;
            opacity: 0.7;
        }

        .booking-room {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 20px;
            margin-bottom: 25px;
        }

        .booking-room-name {
            font-weight: 700;
        }

        .booking-room-type {
            font-size: 14px;
            opacity: 0.7;
            margin-top: 4px;
        }

        .price-breakdown {
            border-top: 1px solid rgba(128, 128, 128, 0.2);
            padding-top: 18px;
        }

        .price-row {
            display: flex;
            justify-content: space-between;
            gap: 20px;
            margin-bottom: 14px;
        }

        .price-row.total {
            margin-top: 18px;
            padding-top: 18px;
            border-top: 1px solid rgba(128, 128, 128, 0.2);
            font-size: 20px;
            font-weight: 800;
        }

        .pay-now-btn {
            width: 100%;
            margin-top: 25px;
            border: none;
            border-radius: 12px;
            padding: 15px 20px;
            font-size: 16px;
            font-weight: 800;
            cursor: pointer;
        }

        .payment-note {
            text-align: center;
            margin-top: 15px;
            font-size: 13px;
            opacity: 0.6;
        }

        .payment-loading {
            text-align: center;
            padding: 60px 20px;
        }

        .payment-error {
            text-align: center;
            padding: 40px 20px;
        }

        .back-link {
            display: inline-block;
            margin-top: 20px;
        }
    </style>
</head>

<body>

    <main class="payment-page">

        <div class="payment-container">

            <div class="payment-header">
                <h1>Complete Your Booking</h1>
                <p>Review your booking before payment.</p>
            </div>

            <div id="paymentContent">

                <div class="payment-loading">
                    Loading booking...
                </div>

            </div>

        </div>

    </main>


    <!-- Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <script>

        const SUPABASE_URL = "https://vyusxdilgwrcgmqqvzsp.supabase.co";

        const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InZ5dXN4ZGlsZ3dyY2dtcXF2enNwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODcxNjYyNTYsImV4cCI6MjEwMjc0MjI1Nn0.X6FbzDad06d5-kj1aK4zQkPSPrrLUW_O7CdfZ-ghwrM";
            

        const supabaseClient =
            window.supabase.createClient(
                SUPABASE_URL,
                SUPABASE_ANON_KEY
            );


        function formatPrice(value) {
            return `₹${Number(value).toLocaleString("en-IN")}`;
        }


        async function loadBooking() {

            const content =
                document.getElementById("paymentContent");

            const params =
                new URLSearchParams(window.location.search);

            const bookingId =
                params.get("booking_id");

            if (!bookingId) {

                content.innerHTML = `
                    <div class="payment-error">
                        <h2>Booking not found</h2>
                        <p>No booking ID was provided.</p>
                        <a class="back-link" href="search.html">
                            Back to Search
                        </a>
                    </div>
                `;

                return;
            }


            // Check logged-in user
            const {
                data: authData
            } = await supabaseClient.auth.getUser();

            const user = authData?.user;

            if (!user) {

                content.innerHTML = `
                    <div class="payment-error">
                        <h2>Please log in</h2>
                        <p>
                            You need to be logged in to continue
                            with your booking.
                        </p>

                        <a class="back-link" href="index.html">
                            Back to RoomDhundo
                        </a>
                    </div>
                `;

                return;
            }


            const {
                data: booking,
                error
            } = await supabaseClient

                .from("bookings")

                .select(`
                    *,
                    buildings (
                        name,
                        location
                    ),
                    room_types (
                        room_type,
                        room_people
                    )
                `)

                .eq("id", bookingId)

                .eq("user_id", user.id)

                .single();


            if (error || !booking) {

                console.error(
                    "Booking fetch error:",
                    error
                );

                content.innerHTML = `
                    <div class="payment-error">
                        <h2>Booking unavailable</h2>
                        <p>
                            We couldn't load this booking.
                        </p>

                        <a class="back-link" href="search.html">
                            Back to Search
                        </a>
                    </div>
                `;

                return;
            }


            if (booking.status !== "pending") {

                content.innerHTML = `
                    <div class="payment-error">
                        <h2>Booking already processed</h2>
                        <p>
                            This booking is no longer pending.
                        </p>

                        <a class="back-link" href="search.html">
                            Back to Search
                        </a>
                    </div>
                `;

                return;
            }


            const property =
                booking.buildings;

            const room =
                booking.room_types;


            content.innerHTML = `

                <div class="payment-card">

                    <div class="booking-property">

                        <h2>
                            ${property?.name || "Property"}
                        </h2>

                        <p>
                            📍 ${property?.location || ""}
                        </p>

                    </div>


                    <div class="booking-room">

                        <div>

                            <div class="booking-room-name">
                                ${room?.room_type || "Room"}
                            </div>

                            <div class="booking-room-type">
                                ${room?.room_people || 1}
                                ${room?.room_people === 1
                                    ? "person"
                                    : "people"
                                } sharing
                            </div>

                        </div>

                        <strong>
                            ${formatPrice(booking.room_rent)}
                        </strong>

                    </div>


                    <div class="price-breakdown">

                        <div class="price-row">

                            <span>
                                Room rent
                            </span>

                            <strong>
                                ${formatPrice(booking.room_rent)}
                            </strong>

                        </div>


                        <div class="price-row">

                            <span>
                                Platform / service fee
                            </span>

                            <strong>
                                ${formatPrice(booking.platform_fee)}
                            </strong>

                        </div>


                        <div class="price-row total">

                            <span>
                                Total
                            </span>

                            <strong>
                                ${formatPrice(booking.total_amount)}
                            </strong>

                        </div>

                    </div>


                    <button
                        type="button"
                        class="pay-now-btn"
                        id="payNowBtn"
                    >
                        Pay Now
                    </button>


                    <div class="payment-note">
                        Razorpay payment integration will be
                        connected here.
                    </div>

                </div>

            `;


            document
                .getElementById("payNowBtn")
                .addEventListener("click", () => {

                    alert(
                        "Payment gateway coming soon. Razorpay will be connected here."
                    );

                });

        }


        document.addEventListener(
            "DOMContentLoaded",
            loadBooking
        );

    </script>

</body>
</html>
